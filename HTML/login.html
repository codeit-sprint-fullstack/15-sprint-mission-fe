<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../CSS/reset.css" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <title>판다마켓 로그인</title>
  </head>
  <body>
    <main class="main">
      <div class="wrap">
        <!--로고-->
        <a href="../HTML/home.html" class="logo">
          <img src="../IMGS/Property 1=lg.png" alt="마켓 로고" />
        </a>
        <form class="form">
          <!--이메일-->
          <div class="email-box">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <!--비밀번호-->
          <div class="pw-box">
            <label for="pw">비밀번호</label>
            <input
              type="password"
              id="pw"
              placeholder="비밀번호를 입력해주세요"
            />
            <!--비밀번호 아이콘-->
            <button type="button" class="pw-toggle">
              <img src="../IMGS/Property 1=Variant2.png" alt="" />
            </button>
          </div>
          <button type="submit" class="login-btn">로그인</button>
        </form>
        <!--간편로그인-->
        <div class="social-login">
          <p>간편 로그인하기</p>
          <div class="social-icons">
            <a href="https://www.google.com/">
              <img src="../IMGS/google.png" alt="Google" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="../IMGS/카톡.svg" alt="Kakao" />
            </a>
          </div>
        </div>
        <!--회원가입-->
        <p class="signup">
          판다마켓이 처음이신가요?
          <a href="../HTML/signup.html">회원가입</a>
        </p>
      </div>
    </main>
  </body>
</html>
