<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panda-market_로그인</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <form id="register-form" name="register">
      <img src="./head-logo.png" class="register-title" />
      <div id="register-id-field">
        <lable for="id">이메일</lable>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="이메일을 입력해주세요"
        />
      </div>
      <div id="password-field">
        <lable for="password">비밀번호</lable>
        <input
          id="password"
          name="password"
          placeholder="비밀번호를 입력해주세요."
        />
      </div>
      <button type="submit">
        로그인
        <a href="/banner"></a>
      </button>
      <div class="easy-tool">
        <div>간편 로그인하기</div>
        <div class="sns-login">
          <a href="https://www.gogle.com/">
            <img src="./icon-google.png" alt="구글 로고" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="./icon-kakaotalk.png" alt="카카오톡 로고" />
          </a>
        </div>
      </div>
      <div class="login-message">
        판다마켓이 처음이신가요??
        <a href="/signup">회원가입</a>
      </div>
    </form>
    <script src="login.js"></script>
  </body>
</html>
