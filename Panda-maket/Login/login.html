<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panda-market_로그인</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <form id="register-form" name="register">
      <h1 class="register-title">로그인</h1>
      <div id="register-id-field">
        <lable for="id">아이디</lable>
        <input
          id="register-id"
          name="register-id"
          type="text"
          placeholder="아이디"
        />
        <div class="error-message"> 아이디가 맞지 않습니다.</div>
      </div>
      <div id="password-field">
        <lable for="password">비밀번호</lable>
        <input id="password" name="password" placeholder="비밀번호" />
        <div class="error-message">비밀번호가 맞지 않습니다.</div>
      </div>
      <button type="submit">로그인
        <a href="/home"></a>
      </button>
      <div class="login-message">
        아이디가 없으신가요?
        <a href="/signup">회원가입</a>
      </div>
    </form>
    <script src="login.js"></script>
  </body>
</html>
