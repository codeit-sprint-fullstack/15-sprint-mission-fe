name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Sprint 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Sprint 4/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build