<!DOCTYPE html>
  <html>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/auth.css">
    <title>회원가입</title>
    <head>       
    </head>
    <body>
      <div class="main">
        <a class="main__logo" href="/index.html">
          <img class="main__logo__img" src="img/Img_panda_face.svg" alt="판다 로고 그림">
          <div class="main__logo__text">판다마켓</div>        
        </a>
        <div class="main__text">
          <div>
            <form>
             <label for="login-email">이메일</label>
             <input id="login-email" name="email" type="email" placeholder="이메일을 입력해주세요"/>
            </form>       
          </div>
           <div>
            <form>
              <label for="login-name">닉네임</label>
              <input id="login-name" name="name" type="text" placeholder="닉네임을 입력해주세요"/>
            </form>
          </div>
          <div> 
              <form class="password">       
                <label for="login-password">비밀번호</label>                
                <div class="password__input">
                  <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해주세요">
                  <input id ="toggle" type="checkbox" class="hidden-checkbox"> 
                  <label for="toggle" class="toggle-btn"></label>
                </div>   
              </form>          
          </div>      
          <div> 
              <form class="password">       
                <label for="login-password">비밀번호 확인</label>                
                <div class="password__input">
                  <input id="login-password" name="password" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요">
                  <input id ="toggle" type="checkbox" class="hidden-checkbox"> 
                  <label for="toggle" class="toggle-btn"></label>
                </div>   
              </form>          
          </div>             
           
           <a class="btn__login" href="#">회원가입</a>
    
           <div class="main__link">
            <div class="main__link__content">
              <h4>간편 로그인하기</h4> 
              <div class="logo">
                <a href="https://www.google.com/" class="google__ic" alt="구글 아이콘"></a>
                <a href="https://www.kakaocorp.com/page/" class="kakao__ic" alt="카카오톡 아이콘"></a>
              </div> 
            </div>  
          </div>
          
          <div class="bottom">
            <h4>이미 회원이신가요?</h4>
            <a href="/login.html" class="login__link">로그인</a>
          </div>
        </div>
      </div>
    </body>
  </html>
