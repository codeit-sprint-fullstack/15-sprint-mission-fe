<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/signup.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <main class="container">
      <a class="logo-container" href="./index.html">
        <img class="logo" src="../assets/logo.png" alt="판다마켓 로고" />
        <img
          class="logo-type"
          src="../assets/logo-type.png"
          alt="판다마켓 로고타입"
        />
      </a>
      <section class="form-container">
        <form class="login-form">
          <div class="email-wrapper">
            <label for="email" class="label-email">이메일</label>
            <input
              id="email"
              class="input-email"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
            <p class="input__message--invalid"></p>
          </div>
          <div class="nickname-wrapper">
            <label for="nickname" class="label-nickname">닉네임</label>
            <input
              id="nickname"
              class="input-nickname"
              placeholder="닉네임을 입력해주세요"
            />
            <p class="input__message--invalid"></p>
          </div>
          <div class="pw-wrapper">
            <label for="pw" class="label-pw">비밀번호</label>
            <div class="pw-input-wrapper">
              <input
                id="pw"
                class="input-pw"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                id="passwordOn"
                class="btn-pw-toggle isPwActive"
                data-target="#pw"
                src="../assets/btn_visibility_off_24px.svg"
                alt="비밀번호 노출 아이콘"
              />
              <img
                id="passwordOff"
                class="btn-pw-toggle"
                data-target="#pw"
                src="../assets/btn_visibility_on_24px.svg"
                alt="비밀번호 비노출 아이콘"
              />
            </div>
            <p class="input__message--invalid"></p>
          </div>
          <div class="pw-check-wrapper">
            <label for="pw-check" class="label-pw">비밀번호 확인</label>
            <div class="pw-input-wrapper pw-check-input-wrapper">
              <input
                id="pw-check"
                class="input-pw"
                type="password"
                placeholder="비밀번호를 입력해주세요"
              />
              <img
                id="passwordCheckOn"
                class="btn-pw-toggle isPwActive"
                data-target="#pw-check"
                src="../assets/btn_visibility_off_24px.svg"
                alt="비밀번호 노출 아이콘"
              />
              <img
                id="passwordCheckOff"
                class="btn-pw-toggle"
                data-target="#pw-check"
                src="../assets/btn_visibility_on_24px.svg"
                alt="비밀번호 비노출 아이콘"
              />
            </div>
            <p class="input__message--invalid"></p>
          </div>
        </form>
        <button id="btn-login" class="btn-login">회원가입</button>
        <div class="easy-login-container">
          <span class="easy-login-label">간편 로그인하기</span>
          <div class="easy-login-btns">
            <a href="https://www.google.com">
              <img src="../assets/login_ic_google.png" alt="구글 로고" />
            </a>
            <a href="https://www.kakaocorp.com/page">
              <img src="../assets/login_ic_kakao.png" alt="카카오 로고" />
            </a>
          </div>
        </div>
        <div class="signup-container">
          <span>이미 회원이신가요?</span>
          <a href="./login.html">로그인</a>
        </div>
      </section>
    </main>

    <script>
      // const signupBtnHandler = () => {
      //   const email = document.getElementById("email")?.value.trim()
      //   const nickname = document.getElementById("nickname")?.value.trim()
      //   const pw = document.getElementById("pw")?.value.trim()
      //   const pwCheck = document.getElementById("pw-check")?.value.trim()
      //   const loginBtn = document.getElementById("btn-login")

      //   if (!loginBtn) return

      //   // 이메일과 패스워드가 모두 존재하면 active 추가, 하나라도 없으면 제거
      //   const isActive = Boolean(email && pw && nickname && pwCheck)
      //   loginBtn.classList.toggle("active", isActive)
      // }

      // document
      //   .querySelector(".login-form")
      //   .addEventListener("input", signupBtnHandler)

      // 이메일 예외처리
      const validateEmail = (value) => {
        const emailRegex = /^[a-zA-Z0-9+-\_.]+@[a-zA-Z0-9-]+\.[a-zA-Z0-9-.]+$/
        const isValid = emailRegex.test(value)
        if (!value) {
          return { isValid: false, message: "이메일을 입력해주세요." }
        }

        if (!isValid) {
          return { isValid: false, message: "잘못된 이메일 형식입니다." }
        }
        return { isValid: true, message: "" }
      }

      const $emailInput = document.querySelector("#email")
      const $emailWrapper = document.querySelector(".email-wrapper")
      const $emailInputMessage = $emailWrapper.querySelector(
        ".input__message--invalid",
      )

      const renderEmailValidation = (value) => {
        const { isValid, message } = validateEmail(value)
        // 메시지 관리
        $emailInputMessage.innerText = message

        $emailInput.classList.toggle("input-invalid", !isValid)
        $emailInputMessage.classList.toggle("input__message--valid", isValid)
      }

      $emailInput.addEventListener("blur", (e) =>
        renderEmailValidation(e.target.value),
      )
      $emailInput.addEventListener("input", (e) =>
        renderEmailValidation(e.target.value),
      )

      // 닉네임 예외처리
      const validateNicname = (value) => {
        if (!value) {
          return { isValid: false, message: "닉네임을 입력해주세요." }
        }
        return { isValid: true, message: "" }
      }

      const $nicknameInput = document.querySelector("#nickname")
      const $nicknameWrapper = document.querySelector(".nickname-wrapper")
      const $nicknameInputMessage = $nicknameWrapper.querySelector(
        ".input__message--invalid",
      )

      const renderNicknameValidation = (value) => {
        const { isValid, message } = validateNicname(value)
        // 메시지 관리
        $nicknameInputMessage.innerText = message

        $nicknameInput.classList.toggle("input-invalid", !isValid)
        $nicknameInputMessage.classList.toggle("input__message--valid", isValid)
      }

      $nicknameInput.addEventListener("blur", (e) =>
        renderNicknameValidation(e.target.value),
      )
      $nicknameInput.addEventListener("input", (e) =>
        renderNicknameValidation(e.target.value),
      )

      // 비밀번호 예외처리
      // 1. 비밀번호 검증
      const validatePassword = (value) => {
        if (!value) {
          return { isValid: false, message: "비밀번호를 입력해주세요." }
        }
        if (value.length < 8) {
          return {
            isValid: false,
            message: "비밀번호를 8자 이상 입력해주세요.",
          }
        }
        return { isValid: true, message: "" }
      }

      // 2. 비밀번호 확인 검증
      const validatePasswordCheck = (value, orgValue) => {
        if (!value) {
          return { isValid: false, message: "비밀번호를 입력해주세요." }
        }
        if (orgValue !== value) {
          return { isValid: false, message: "비밀번호가 일치하지 않습니다." }
        }
        return { isValid: true, message: "" }
      }

      // 3. 선택자
      const $pwInput = document.querySelector("#pw")
      const $pwWrapper = document.querySelector(".pw-wrapper")
      const $pwInputMessage = $pwWrapper.querySelector(
        ".input__message--invalid",
      )

      const $pwCheckWrapper = document.querySelector(".pw-check-wrapper")
      const $pwCheckInput = document.querySelector("#pw-check")
      const $pwCheckMessage = $pwCheckWrapper.querySelector(
        ".input__message--invalid",
      )

      // 4. 비밀번호 확인 렌더링 함수
      const renderPasswordCheckValidation = (value) => {
        const checkValue = $pwCheckInput.value
        const orgValue = $pwInput.value
        const { isValid, message } = validatePasswordCheck(checkValue, orgValue)
        $pwCheckMessage.innerText = message

        $pwCheckInput.classList.toggle("input-invalid", !isValid)
        $pwCheckMessage.classList.toggle("input__message--valid", isValid)
      }

      // 5. 비밀번호 렌더링 함수
      const renderPasswordValidation = (value) => {
        const { isValid, message } = validatePassword(value)

        $pwInputMessage.innerText = message

        $pwInput.classList.toggle("input-invalid", !isValid)
        $pwInputMessage.classList.toggle("input__message--valid", isValid)

        if ($pwCheckInput.value) {
          renderPasswordCheckValidation()
        }
      }

      // 비밀번호 이벤트 바인딩
      $pwInput.addEventListener("blur", (e) =>
        renderPasswordValidation(e.target.value),
      )
      $pwInput.addEventListener("input", (e) =>
        renderPasswordValidation(e.target.value),
      )

      // 비밀번호 확인 이벤트 바인딩
      $pwCheckInput.addEventListener("blur", (e) =>
        renderPasswordCheckValidation(e.target.value),
      )
      $pwCheckInput.addEventListener("input", (e) =>
        renderPasswordCheckValidation(e.target.value),
      )

      // TODO:회원가입 버튼 활성화 처리

      // 비밀번호 노출/비노출 토글
      // 비밀번호 입력
      const $pwInputWrapper = document.querySelector(".pw-input-wrapper")

      $pwInputWrapper.addEventListener("click", (e) => {
        const $btn = e.target.closest(".btn-pw-toggle")

        if (!$btn) return

        const $onBtn = document.querySelector("#passwordOn")
        const $offBtn = document.querySelector("#passwordOff")
        $onBtn.classList.toggle("isPwActive")
        $offBtn.classList.toggle("isPwActive")

        const targetId = $btn.dataset.target
        const $input = $pwInputWrapper.querySelector(targetId)

        const isPwVisible = $onBtn.classList.contains("isPwActive")
        $input.type = isPwVisible ? "password" : "text"
      })

      // 비밀번호 체크
      const $pwCheckInputWrapper = document.querySelector(".pw-check-wrapper")

      $pwCheckInputWrapper.addEventListener("click", (e) => {
        const $btn = e.target.closest(".btn-pw-toggle")
        if (!$btn) return

        const $onBtn = document.querySelector("#passwordCheckOn")
        const $offBtn = document.querySelector("#passwordCheckOff")
        $onBtn.classList.toggle("isPwActive")
        $offBtn.classList.toggle("isPwActive")

        const targetId = $btn.dataset.target
        const $input = $pwCheckInputWrapper.querySelector(targetId)

        const isPwVisible = $onBtn.classList.contains("isPwActive")
        $input.type = isPwVisible ? "password" : "text"
      })
    </script>
  </body>
</html>
