<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/reset.css" />
    <link rel="stylesheet" href="../styles/signup.css" />
    <link rel="stylesheet" href="../styles/global.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <main class="container">
      <a class="logo-container" href="./index.html">
        <img class="logo" src="../assets/logo.png" alt="판다마켓 로고" />
        <img
          class="logo-type"
          src="../assets/logo-type.png"
          alt="판다마켓 로고타입"
        />
      </a>
      <section class="form-container">
        <form class="login-form">
          <label for="email" class="label-email">이메일</label>
          <input
            id="email"
            class="input-email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />
          <label for="nickname" class="label-nickname">닉네임</label>
          <input
            id="nickname"
            class="input-nickname"
            placeholder="닉네임을 입력해주세요"
          />
          <label for="pw" class="label-pw">비밀번호</label>
          <div class="pw-wrapper">
            <input
              id="pw"
              class="input-pw"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <img
              id="passwordOn"
              class="btn-pw-toggle isPwActive"
              data-target="#pw"
              src="../assets/btn_visibility_off_24px.svg"
              alt="비밀번호 노출 아이콘"
            />
            <img
              id="passwordOff"
              class="btn-pw-toggle"
              data-target="#pw"
              src="../assets/btn_visibility_on_24px.svg"
              alt="비밀번호 비노출 아이콘"
            />
          </div>
          <label for="pw-check" class="label-pw">비밀번호 확인</label>
          <div class="pw-wrapper pw-check-wrapper">
            <input
              id="pw-check"
              class="input-pw"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <img
              id="passwordCheckOn"
              class="btn-pw-toggle isPwActive"
              data-target="#pw-check"
              src="../assets/btn_visibility_off_24px.svg"
              alt="비밀번호 노출 아이콘"
            />
            <img
              id="passwordCheckOff"
              class="btn-pw-toggle"
              data-target="#pw-check"
              src="../assets/btn_visibility_on_24px.svg"
              alt="비밀번호 비노출 아이콘"
            />
          </div>
        </form>
        <button id="btn-login" class="btn-login">회원가입</button>
        <div class="easy-login-container">
          <span class="easy-login-label">간편 로그인하기</span>
          <div class="easy-login-btns">
            <a href="https://www.google.com">
              <img src="../assets/login_ic_google.png" alt="구글 로고" />
            </a>
            <a href="https://www.kakaocorp.com/page">
              <img src="../assets/login_ic_kakao.png" alt="카카오 로고" />
            </a>
          </div>
        </div>
        <div class="signup-container">
          <span>이미 회원이신가요?</span>
          <a href="./login.html">로그인</a>
        </div>
      </section>
    </main>

    <script>
      const signupBtnHandler = () => {
        const email = document.getElementById("email")?.value.trim()
        const nickname = document.getElementById("nickname")?.value.trim()
        const pw = document.getElementById("pw")?.value.trim()
        const pwCheck = document.getElementById("pw-check")?.value.trim()
        const loginBtn = document.getElementById("btn-login")

        if (!loginBtn) return

        // 이메일과 패스워드가 모두 존재하면 active 추가, 하나라도 없으면 제거
        const isActive = Boolean(email && pw && nickname && pwCheck)
        loginBtn.classList.toggle("active", isActive)
      }

      document
        .querySelector(".login-form")
        .addEventListener("input", signupBtnHandler)

      // 비밀번호 노출/비노출 토글
      // 비밀번호 입력
      const $pwWrapper = document.querySelector(".pw-wrapper")

      $pwWrapper.addEventListener("click", (e) => {
        const $btn = e.target.closest(".btn-pw-toggle")

        if (!$btn) return

        const $onBtn = document.querySelector("#passwordOn")
        const $offBtn = document.querySelector("#passwordOff")
        $onBtn.classList.toggle("isPwActive")
        $offBtn.classList.toggle("isPwActive")

        const targetId = $btn.dataset.target
        const $input = $pwWrapper.querySelector(targetId)

        const isPwVisible = $onBtn.classList.contains("isPwActive")
        $input.type = isPwVisible ? "password" : "text"
      })

      // 비밀번호 체크
      const $pwCheckWrapper = document.querySelector(".pw-check-wrapper")

      $pwCheckWrapper.addEventListener("click", (e) => {
        const $btn = e.target.closest(".btn-pw-toggle")
        if (!$btn) return

        const $onBtn = document.querySelector("#passwordCheckOn")
        const $offBtn = document.querySelector("#passwordCheckOff")
        $onBtn.classList.toggle("isPwActive")
        $offBtn.classList.toggle("isPwActive")

        const targetId = $btn.dataset.target
        const $input = $pwCheckWrapper.querySelector(targetId)

        const isPwVisible = $onBtn.classList.contains("isPwActive")
        $input.type = isPwVisible ? "password" : "text"
      })
    </script>
  </body>
</html>
