<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>판다마켓</title>
<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

  
  <header class="header">
    <div class="inner">
      <a href="/" class="logo">
        <img src="판다 얼굴.png" alt="판다마켓 로고">
        <span>판다마켓</span>
      </a>
      <a href="/login" class="login-btn">
        <img src="btn_small_48.png" alt="로그인">
      </a>
    </div>
  </header>

  
  <section class="hero">
    <div class="inner">
      <div class="hero-text">
        <h1>일상의 모든 물건을<br>거래해 보세요</h1>
        <a href="/items" class="cta-btn">
          <img src="btn_large.png" alt="구경하러 가기">
        </a>
      </div>
      <div class="hero-image">
        <img src="Img_home_top.png" alt="판다마켓 캐릭터">
      </div>
    </div>
  </section>

  
  <section class="features">
    <div class="inner">

      <div class="feature-row">
        <img src="Img_home_01.png" alt="인기 상품">
        <div class="feature-text">
          <p class="feature-eyebrow">Hot item</p>
          <h2>인기 상품을<br>확인해 보세요</h2>
          <p>가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
        </div>
      </div>

      <div class="feature-row reverse">
        <img src="Img_home_02.png" alt="검색">
        <div class="feature-text">
          <p class="feature-eyebrow">Search</p>
          <h2>구매를 원하는<br>상품을 검색하세요</h2>
          <p>구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
        </div>
      </div>

      <div class="feature-row">
        <img src="Img_home_03.png" alt="상품 등록">
        <div class="feature-text">
          <p class="feature-eyebrow">Register</p>
          <h2>판매를 원하는<br>상품을 등록하세요</h2>
          <p>어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
        </div>
      </div>

    </div>
  </section>

  
  <section class="trust">
    <div class="inner">
      <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>
      <div class="trust-image">
        <img src="Img_home_bottom.png" alt="판다마켓 신뢰 거래">
      </div>
    </div>
  </section>

  
  <footer class="footer">
    <div class="inner">
      <p class="footer-copyright">©codeit - 2024</p>

      <nav class="footer-links">
        <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
        <a href="/faq" target="_blank" rel="noopener">FAQ</a>
      </nav>

      <div class="footer-sns">
       <img src="ic_facebook.png" alt="페이스북 마크">
       <img src="ic_instagram.png" alt="인스타그램 마크">
       <img src="ic_twitter.png" alt="트위터 마크">
       <img src="ic_youtube.png" alt="유튜브 마크">
        
      </div>
    </div>
  </footer>

</body>
</html>
