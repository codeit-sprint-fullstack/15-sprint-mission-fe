<!DOCTYPE html>
<html lang="ko">
  
   <head>
      <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓 로그인</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  

  <body>
    <main class="auth-page">
      
      <div class="logo">
        <img class="logo-face" src="판다 얼굴.png" alt="판다 얼굴">
        <img class="logo-name" src="판다마켓.png" alt="판다마켓">
      </div>

      <form class="auth-form">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" placeholder="이메일을 입력해주세요">
        <label for="login-password">비밀번호</label>
        
        
      <div class="input-wrap">
        <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해주세요">
        <img src="eye off.png" class="eye-icon" /> 
        <!-- eye-icon 처음에 -빼먹어서 css와 연결이 되지가 않아서 헤매였다... -->
      </div>
        
        <button class="image-button" type="submit">
          <img src="btn_large_graylogin.png" alt="로그인">
        </button>
      </form>

      <div class="social-login">
        <span>간편 로그인하기</span>
        <div class="social-icons">
          <a href="https://www.google.com/" target="_blank">
            <img src="Component 2.png" alt="Google로 로그인">
          </a>
          <a href="https://www.kakaocorp.com/" target="_blank">
            <img src="Component 3.png" alt="카카오로 로그인">
          </a>
        </div>
      </div>

      <p class="switch-page">
              판다마켓이 처음이신가요? <a href="./signup.html">회원가입</a>
      </p>
    </main>
  </body>
</html>
