<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/reset.css" />
    <link rel="stylesheet" href="../style/signup.css" />
    <title>Panda-Signup</title>
    <link rel="icon" href="../img/판다 얼굴.svg" />
  </head>
  <body>
    <div class="mainbody">
      <header>
        <a href="../index.html">
          <img src="../img/판다 얼굴.svg" alt="pandaicon" />
          판다마켓
        </a>
      </header>
      <main>
        <form>
          <label for="signup-email">이메일</label>
          <input
            id="signup-email"
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />
          <label for="signup-nickname">닉네임</label>
          <input
            id="signup-nickname"
            name="nickname"
            type="text"
            placeholder="닉네임을 입력해주세요"
          />
          <label for="signup-passwd">비밀번호</label>
          <input
            id="signup-passwd"
            name="passwd"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          />
          <label for="signup-passwd2">비밀번호 확인</label>
          <input
            id="signup-passwd2"
            name="passwd2"
            type="password"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
          />
          <button class="signup-button">회원가입</button>
        </form>
        <div class="simple-login">
          간편 로그인하기
          <div class="login-icon">
            <a href="https://www.google.com/" target="_blank">
              <img src="../img/ic_google.svg" alt="googleicon" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="../img/ic_kakao.svg" alt="kakaoicon" />
            </a>
          </div>
        </div>
      </main>
      <footer>
        이미 회원이신가요?
        <a href="./login.html">로그인</a>
      </footer>
    </div>
  </body>
</html>
