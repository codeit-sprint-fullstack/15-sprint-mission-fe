<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>판다마켓</title>
        <link rel="stylesheet" href="../styles/reset.css" />             
        <link rel="stylesheet" href="../styles/common.css" />  
        <link rel="stylesheet" href="../styles/auth.css" />
    </head>
    <body>
    <div class="login_outbox">
        <a href="./index.html"><img src="../images/logo.png" alt="판다 얼굴이 있는 판다마켓 로고"></a>
        <form>
            <div class="email">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" placeholder="이메일을 입력해주세요"/>
            </div>
            
            <div class="nickname">
            <label for="nickname">닉네임</label>
            <input id="nickname" name="nickname" type="text" placeholder="닉네임을 입력해주세요" />
            </div>
            <div class="password">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
            </div>
            <div class="password-check">
            <label for="password-check">비밀번호 확인</label>
            <input id="password-check" name="password-check" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요"/>
            </div>            
            <button type="button">회원가입</button>
        </form>
        <div class="quick_login_menu">
            <p>간편 로그인하기</p>
            <div class="sns_login">
                <a href="https://www.google.com"><img src="../images/ic_google.png" alt="구글 로고"></a>
                <a href="https://www.kakaocorp.com/page/"><img src="../images/ic_kakaotalk.png" alt="카카오톡 로고"></a>
            </div>
        </div>
        <div class="auth_switch">
            <p>이미 회원이신가요?</p>
            <a href="./login.html">로그인</a>
        </div>
    </div>
    </body>
</html>
