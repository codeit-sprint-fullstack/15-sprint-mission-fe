<!DOCTYPE html>
  <html>
    <head>       
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/css/auth.css">
      <title>회원가입</title>
    </head>
    <body>
      <div class="main">
        <a class="logo" href="/pages/index.html">
          <img class="logo__img" src="/img/img_panda_face.svg" alt="판다 로고 그림">
          <div class="logo__text">판다마켓</div>        
        </a>
        <div class="main__text">
          <div>
            <form>
             <label for="signup-email">이메일</label>
             <input id="signup-email" name="email" type="email" placeholder="이메일을 입력해주세요"/>
            </form>       
          </div>
           <div>
            <form>
              <label for="signup-name">닉네임</label>
              <input id="signup-name" name="name" type="text" placeholder="닉네임을 입력해주세요"/>
            </form>
          </div>
          <div> 
              <form class="password">       
                <label for="password">비밀번호</label>                
                <div class="password__input">
                  <input id="password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
                  <input id="toggle" type="checkbox" class="password__checkbox"/> 
                  <label for="toggle" class="password__toggle"></label>
                </div>   
              </form>          
          </div>      
          <div> 
              <form class="password">       
                <label for="password-confirm">비밀번호 확인</label>                
                <div class="password__input">
                  <input id="password-confirm" name="password-confirm" type="password" placeholder="비밀번호를 다시 한 번 입력해주세요"/>
                  <input id="toggle2" type="checkbox" class="password__checkbox"/> 
                  <label for="toggle2" class="password__toggle"></label>
                </div>   
              </form>          
          </div>             
           
           <a class="btn" id="btn--signup" href="#">회원가입</a>
    
           <div class="auth-link">
            <div class="auth-link__content">
              <h4 class="auth-link__title">간편 로그인하기</h4> 
              <div class="sns">
                <a href="https://www.google.com/" class="sns__icon--google" alt="구글 아이콘"></a>
                <a href="https://www.kakaocorp.com/page/" class="sns__icon--kakao" alt="카카오톡 아이콘"></a>
              </div> 
            </div>  
          </div>
          
          <div class="auth-footer">
            <h4>이미 회원이신가요?</h4>
            <a href="/pages/login.html" class="auth-footer__link">로그인</a>
          </div>
        </div>
      </div>
    </body>
  </html>
