<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panda-Login</title>
    <link rel="stylesheet" href="../style/reset.css" />
    <link rel="stylesheet" href="../style/login.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dongle&family=Noto+Sans+KR:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="../img/판다 얼굴.svg" />
  </head>
  <body>
    <div class="mainbody">
      <header>
        <a href="../index.html">
          <img src="../img/판다 얼굴.svg" alt="pandaicon" />
          판다마켓
        </a>
      </header>
      <main>
        <form>
          <label for="login-email">이메일</label>
          <input
            id="login-email"
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />
          <div class="email error" style="display: none;">
            <span class="error-text">error text</span>
          </div>
          <label for="login-passwd" style="margin-top: 1.5rem;">비밀번호</label>
          <input
            id="login-passwd"
            name="passwd"
            type="password"
            placeholder="비밀번호를 입력해주세요"
          />
          <div class="passwd error" style="display: none;">
            <span class="error-text">error text</span>
          </div>
          <button class="login-button">로그인</button>
        </form>
        <div class="simple-login">
          간편 로그인하기
          <div class="login-icon">
            <a href="https://www.google.com/" target="_blank">
              <img src="../img/ic_google.svg" alt="googleicon" />
            </a>
            <a href="https://www.kakaocorp.com/page/" target="_blank">
              <img src="../img/ic_kakao.svg" alt="kakaoicon" />
            </a>
          </div>
        </div>
      </main>
      <footer>
        판다마켓이 처음이신가요?
        <a href="./signup.html">회원가입</a>
      </footer>
    </div>
    <script src="../script/login.js" defer></script>
  </body>
</html>
