<!DOCTYPE html>
  <html lang="ko">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="/css/reset.css" />
      <link rel="stylesheet" href="/css/variables.css" />
      <link rel="stylesheet" href="/css/auth.css" />    
      <title>로그인</title>
    </head>
    <body>
      <main>
        <a class="logo" href="/">
          <img class="logo__img" src="/img/img_panda_face.svg" alt="판다 로고 그림" />
          <div class="logo__text">판다마켓</div>        
        </a>

        <div class="main__text">
          <div>
             <form>
             <label for="login-email">이메일</label>
             <input id="login-email" name="email" type="email" placeholder="이메일을 입력해주세요"/>                    
                <label for="login-password">비밀번호</label>                
                <div class="password__input">
                  <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
                  <input id="toggle" type="checkbox" class="password__checkbox"/> 
                  <label for="toggle" class="password__toggle"></label>
                </div>
                <button class="btn" id="btn--login">로그인</button>    
              </form>          
          </div>            
           <div class="auth-link">
            <div class="auth-link__content">
              <h4 class="auth-link__title">간편 로그인하기</h4> 
              <div class="sns">
                <a href="https://www.google.com/" class="sns__icon--google" alt="구글 아이콘"></a>
                <a href="https://www.kakaocorp.com/page/" class="sns__icon--kakao" alt="카카오톡 아이콘"></a>
              </div> 
            </div>  
          </div>          
        </div>
        <footer>
          <p>판다마켓이 처음이신가요?</p>
          <a class="auth-footer__link" href="/pages/signup.html">회원가입</a>
        </footer>
      <main>
    </body>
  </html>
