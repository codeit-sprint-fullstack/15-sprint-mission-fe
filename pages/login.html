<!DOCTYPE html>
  <html lang="ko">
    <head> 
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <!-- 구글 애널리틱스로 방문자 수 확인 -->
     <script async src="https://www.googletagmanager.com/gtag/js?id=G-GSDGWH1Y1F"></script>
     <script src="/js/login.js" defer></script>
     <script>
       window.dataLayer = window.dataLayer || [];
       function gtag(){dataLayer.push(arguments);}
       gtag('js', new Date());
 
       gtag('config', 'G-GSDGWH1Y1F');
     </script>      
      <link rel="stylesheet" href="/css/reset.css" />
      <link rel="stylesheet" href="/css/variables.css" />
      <link rel="stylesheet" href="/css/auth.css" />    
      <title>로그인</title>
    </head>
    <body>
      <main>
        <a class="logo" href="/">
          <img class="logo__img" src="/img/img_panda_face.svg" alt="판다 로고 이미지" />
          <div class="logo__text">판다마켓</div>        
        </a>
        <div class="container__text">       
            <form>
            <label for="login-email">이메일</label>
            <input id="login-email" name="email" type="email" placeholder="이메일을 입력해주세요"/> 
            <p id="login-emailError" style=display:none> 올바른 이메일 형식이 아닙니다.</p>                            
              <label for="login-password">비밀번호</label>                
              <div class="password__input">
                <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
                <input id="toggle" type="checkbox" class="password__checkbox"/> 
                <label for="toggle" class="password__toggle"></label>
              </div>
              <button class="btn btn--login">로그인</button>    
            </form>          
          </div>            
          <div class="auth-link">
          <div class="auth-link__content">
            <p class="auth-link__title">간편 로그인하기</p> 
            <div class="sns">
              <a href="https://www.google.com/" class="sns__icon--google" aria-label="구글로 로그인"></a>
              <a href="https://www.kakaocorp.com/page/" class="sns__icon--kakao" aria-label="카카오로 로그인"></a>
            </div> 
          </div>  
        </div>      
        <div class="auth-footer">
          <p>판다마켓이 처음이신가요?</p>
          <a class="auth-footer__link" href="/pages/signup.html">회원가입</a>
        </div>
      </main>
    </body>
  </html>
