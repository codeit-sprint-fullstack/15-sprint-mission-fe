<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../style/global.css" />
    <link rel="stylesheet" href="../../style/login.css" />
    <title>회원가입</title>
  </head>
  <body>
    <form action="">
      <div>
        <a href="../../index.html">
          <img
            class="panda-logo"
            src="../../src/images/panda-market-logo.png"
            alt="판다마켓 로고"
          />
        </a>
      </div>
      <div>
        <label for="userEmail">이메일</label>
        <input
          type="email"
          id="userEmail"
          name="userEmail"
          placeholder="이메일을 입력해주세요"
        />
      </div>
      <div>
        <label for="userName">닉네임</label>
        <input
          type="text"
          id="userName"
          name="userName"
          placeholder="닉네임을 입력해주세요"
        />
      </div>
      <div class="input-password">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="비밀번호를 입력해주세요"
        />
        <div class="eyes">
          <i class="fa-regular fa-eye-slash"></i>
        </div>
      </div>
      <div class="input-password">
        <label for="password-check">비밀번호 확인</label>
        <input
          type="password"
          id="password-check"
          name="password-check"
          placeholder="비밀번호를 다시 한 번 입력해주세요"
        />
        <div class="eyes">
          <i class="fa-regular fa-eye-slash"></i>
        </div>
      </div>
      <button id="loginBtn" class="pillBtn">회원가입</button>
      <div class="provider">
        <div>간편 로그인하기</div>
        <div class="provider-icons">
          <div class="provider-login-icons-google">
            <a href="https://www.google.com/"
              ><img src="../../src/icon/google.png" width="22" alt=""
            /></a>
          </div>
          <div class="provider-login-icons-kakao">
            <a href="https://www.kakaocorp.com/page/"
              ><img src="../../src/icon/kakao.svg" width="22" alt=""
            /></a>
          </div>
        </div>
      </div>
      <div>
        이미 회원이신가요?
        <a id="registerLink" href="../login/login.html">로그인</a>
      </div>
    </form>
  </body>
</html>
