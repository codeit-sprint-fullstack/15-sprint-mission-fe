<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 상단바 -->
    <header class="top_gdn">
      <div class="logo_gap">
        <a href="index.html">
          <img src="/image/logo.png" alt="판다마켓로고" class="logo" />
        </a>
        <a href="login.html" class="btn_login">로그인</a>
      </div>
    </header>

    <!-- 메인배너 -->
    <main class="main_banner">
      <div class="banner_text">
        <h1 class="main_title">
          일상의 모든 물건을
          <br />
          거래해 보세요
        </h1>
        <a href="/items" class="btn_go">구경하러 가기</a>
      </div>

      <div class="main_img">
        <img src="/image/Img_home_top.png" alt="판다마켓 메인배너" />
      </div>
    </main>

    <section class="sub">
      <!-- 핫아이템 -->
      <div class="sub_back">
        <div class="sub_box">
          <img src="/image/Img_home_01.png" class="sub_img" alt="인기상품" />
          <div class="sub_text">
            <span class="sub_tag">Hot item</span>
            <h2 class="sub_title">
              인기 상품을
              <br />
              확인해보세요
            </h2>
            <p class="text">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>

      <!-- 검색 -->
      <div class="sub_back">
        <div class="sub_box">
          <div class="sub_reverse">
            <img src="/image/Img_home_02.png" alt="상품검색" />
            <div class="sub_text">
              <span class="sub_tag">Search</span>
              <h2 class="sub_title">
                구매를 원하는
                <br />
                상품을 검색하세요
              </h2>
              <p class="text">
                구매하고 싶은 물품을 검색해서
                <br />
                쉽게 찾아보세요
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- 상품등록 -->
      <div class="sub_back">
        <div class="sub_box">
          <img src="/image/Img_home_03.png" alt="상품등록" />
          <div class="sub_text">
            <span class="sub_tag">Register</span>
            <h2 class="sub_title">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <p class="text">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </section>

    <div class="gray_box"></div>

    <!-- 아웃트로 -->
    <div class="bottom">
      <div class="bottom_text">
        <h2 class="main_title">
          믿을 수 있는
          <br />
          판다마켓 중고 거래
        </h2>
      </div>
      <img
        class="bottom_img"
        src="/image/Img_home_bottom.png"
        alt="하늘배경판다마켓"
      />
    </div>

    <!-- 하단바 -->
    <footer class="foot">
      <div class="foot_box">
        <span class="codeit">#codeit - 2024</span>
        <div class="p_q">
          <a href="/privacy">Privacy policy</a>
          <a href="/faq">FAQ</a>
        </div>

        <div class="icon">
          <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
            <img src="/image/gnb/ic_facebook.png" alt="페이스북" />
          </a>
          <a href="https://x.com/?lang=ko" target="_blank">
            <img src="/image/gnb/ic_twitter.png" alt="트위터" />
          </a>
          <a
            href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR"
            target="_blank"
          >
            <img src="/image/gnb/ic_youtube.png" alt="유튜브" />
          </a>
          <a href="https://www.instagram.com/">
            <img src="/image/gnb/ic_instagram.png" alt="인스타그램" />
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
