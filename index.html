  <head>
    <meta charset="UTF-8" />

    <title>판다마켓</title>

    <link

      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      as="style"

  <body>
    <header>
      <div class="logoAndlogin">
        <a class="logo" href="index.html">
          <img src="./Images/MarketLogo.png" alt="#logo" />
        </a>
        <a class="login" href="login.html">로그인</a>
      </div>
    </header>
    <section>
      <div class="section01">
        <div class="wrap-section01">
          <div class="goitem">
            <div class="content-01">
              <p>일상의 모든 물건을</p>
              <p>거래해 보세요</p>
            </div>
            <button>
              <a href="items.html">구경하러 가기</a>
            </button>
          </div>
          <div class="section01-img"></div>
        </div>
      </div>
      <div class="section02">
        <div class="wrap-section02">
          <div class="section02-img"></div>
          <div class="goitem02">
            <div class="hotbadge">Hot item</div>
            <div class="content-02">
              <p>인기 상품을</p>
              <p>확인해 보세요</p>
            </div>
            <p>가장 HOT한 중고거래 물품을판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </div>
      <div class="section03">
        <div class="wrap-section03">
          <div class="section03-img"></div>
          <div class="goitem03">
            <div class="search">Search</div>
            <div class="content-03">
              <p>구매를 원하는</p>
              <p>상품을 검색하세요</p>
            </div>
            <p>구매하고 싶은 물품은 검색해서</p>
            <p>쉽게 찾아보세요</p>
          </div>
        </div>
      </div>
      <div class="section04">
        <div class="wrap-section04">
          <div class="section04-img"></div>
          <div class="goitem04">
            <div class="register">Register</div>
            <div class="content-04">
              <p>판매를 원하는</p>
              <p>상품을 등록하세요</p>
            </div>
            <p>어떤 물건이든 판매하고 싶은 상품을</p>
            <p>쉽게 등록하세요</p>
          </div>
        </div>
      </div>
      <div class="section05">
        <div class="wrap-section05">
          <div class="goitem05">
            <div class="content-05">
              <p>믿을 수 있는</p>
              <p>판다마켓 중고 거래</p>
            </div>
          </div>
          <div class="section05-img"></div>
        </div>
      </div>
    </section>
