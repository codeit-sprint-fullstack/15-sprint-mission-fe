<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <link rel="stylesheet" href="./style/reset.css" /> -->
    <link rel="stylesheet" href="./style/index.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./style/global.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=ROKAF Sans:wght@700&display=swap"
    />
    <title>판다마켓</title>
  </head>
  <body>
    <header>
      <a href="/"
        ><img
          class="homeBtn"
          src="./src/images/panda-market-logo.png"
          alt="판다마켓 홈 이미지"
      /></a>
      <a href="./pages/login/login.html" id="loginBtn" class="button">로그인</a>
    </header>

    <main class="pandaContentBox">
      <div class="container">
        <h1>일상의 모든 물건을<br />거래해 보세요</h1>
        <a class="button pillBtn" href="./pages/items/items.html"
          >구경하러 가기</a
        >
      </div>
    </main>

    <section class="container">
      <div class="feature">
        <img
          src="./src/images/feature1-image.png"
          alt="인기 상품"
          width="50%"
        />
        <div class="featureContent">
          <h2 class="featureTag">Hot item</h2>
          <h1>인기 상품을<br />확인해 보세요</h1>
          <p class="featureDescription">
            가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
          </p>
        </div>
      </div>

      <div class="feature">
        <div class="featureContent">
          <h2 class="featureTag">Search</h2>
          <h1>구매를 원하는<br />상품을 검색하세요</h1>
          <p class="featureDescription">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
        <img
          src="./src/images/feature2-image.png"
          alt="검색 기능"
          width="50%"
        />
      </div>

      <div class="feature">
        <img
          src="./src/images/feature3-image.png"
          alt="판매 상품 등록"
          width="50%"
        />
        <div class="featureContent">
          <h2 class="featureTag">Register</h2>
          <h1>판매를 원하는<br />상품을 등록하세요</h1>
          <p class="featureDescription">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <section id="bottomContainer" class="pandaContentBox">
      <div class="container">
        <h1>믿을 수 있는<br />판다마켓 중고거래</h1>
      </div>
    </section>
    <footer>
      <div>©codeit - 2024</div>
      <div id="footerMenu">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div id="socialMedia">
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/social/facebook-logo.svg" alt="페이스북" width="20" />
        </a>
        <a
          href="https://twitter.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/social/twitter-logo.svg" alt="트위터" width="20" />
        </a>
        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img src="src/social/youtube-logo.svg" alt="유튜브" width="20" />
        </a>
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="src/social/instagram-logo.svg"
            alt="인스타그램"
            width="20"
          />
        </a>
      </div>
    </footer>
  </body>
</html>
