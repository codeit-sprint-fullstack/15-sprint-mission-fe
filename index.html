<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="nav-outbox">
      <nav>
        <a class="nav-logo" href="/"><img src="Property 1=lg.png" alt="판다 얼굴이 있는 판다마켓 로고"></a>
        <a class="login-button" href="/login">로그인</a>
      </nav>
    </div>
    <div class="header-outbox">
      <header>
        <div class="header-inbox">
        <div class="header-text_and_button">
        <h1>
          일상의 모든 물건을
          <br />
          거래해 보세요
        </h1>
        <a class="header-button" href="/items">구경하러 가기</a>
        </div>
        <div class="header-image">        
        <img src="Img_home_top.png" alt="가방을 들고 서 있는 판다 캐릭터 이미지"/>
        </div>
        </div>
      </header>
    </div>
    <main>
        <section class="card">
          <div class="card-image">
            <img src="Img_home_01.png" alt="하트가 표시된 상품을 보고 있는 판다 캐릭터 이미지" />
          </div>
          <div class="card-text">
            <h2>Hot item</h2>
            <p class="card-text p1">
              인기 상품을
              <br />
              확인해 보세요
            </p>
            <p class="card-text p2">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </section>
        <hr />
        <section class="card">
          <div class="card-image">
            <img src="Img_home_02.png" alt="돋보기로 상품을 검색하는 이미지" />
          </div>
          <div class="card-text">
            <h2>Search</h2>
            <p class="card-text p1">
              구매를 원하는
              <br />
              상품을 검색하세요
            </p>
            <p class="card-text p2">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </section>
        <hr />
        <section class="card">
          <div class="card-image">
            <img src="Img_home_03.png" alt="상품 사진들과 마술 지팡이 이미지" />
          </div>
          <div class="card-text">
            <h2>Register</h2>
            <p class="card-text p1">
              판매를 원하는
              <br />
              상품을 등록하세요
            </p>
            <p class="card-text p2">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </section>
      <hr />
      <!-- 카드 섹션과 푸터 사이에 색깔이 다른 여백 있음. -->
      <div class="main-footer-outbox">
        <div class="main-footer">
          <div class="main-footer-inbox">
          <h1>
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </h1>
          <img src="Img_home_bottom.png" alt="판다 캐릭터 둘이 만나 인사하는 이미지"/>
          </div>
        </div>
      </div>
    </main>
    <div class="footer-outbox">
      <footer class="footer">
        <div class="footer-left">
          <span>&copy;codeit - 2024</span>
        </div>
        <div class="footer-center">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </div>
        <div class="footer-right">
          <a href="https://www.facebook.com/?locale=ko_KR" target="_blank"><img src="ic_facebook.png" alt="페이스북 아이콘"></a>
          <a href="https://x.com/?lang=ko" target="_blank"><img src="ic_twitter.png" alt="트위터 아이콘"></a>
          <a href="https://www.youtube.com/?app=desktop&hl=ko&gl=KR" target="_blank"><img src="ic_youtube.png" alt="유튜브 아이콘"></a>
          <a href="https://www.instagram.com/" target="_blank"><img src="ic_instagram.png" alt="인스타그램 아이콘"></a>
        </div>
      </footer>
    </div>
  </body>
</html>
