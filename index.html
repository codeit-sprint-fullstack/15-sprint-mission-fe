<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/reset.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script type="module" src="./JS/main.js"></script>
    <title>판다마켓</title>
  </head>
  <body>
    <!--헤더 시작-->
    <header class="header">
      <div class="container">
        <a href="/">
          <img src="./IMGS/Property 1=lg.png" alt="판다마켓 로고" />
        </a>
        <a href="login.html" class="login-btn">로그인</a>
      </div>
    </header>
    <!--헤더 끝-->

    <!--메인 시작-->
    <main class="main">
      <div class="home-top">
        <div class="container">
          <div class="top-text">
            <p>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </p>
            <a href="/items" class="items-btn">구경하러 가기</a>
          </div>
          <img src="./IMGS/Img_home_top.png" alt="top-banner" />
        </div>
      </div>
      <!--con box1-->
      <div class="con-box con1">
        <div class="container">
          <img
            src="./IMGS/Img_home_01.png"
            alt="상품 일러스트"
            class="con-img"
          />
          <div class="con-text">
            <p>Hot item</p>
            <p>
              인기 상품을
              <br />
              확인해 보세요
            </p>
            <p>
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </div>
      <!--con box2-->
      <div class="con-box con2">
        <div class="container">
          <img
            src="./IMGS/Img_home_02.png"
            alt="검색 일러스트"
            class="con-img"
          />
          <div class="con-text">
            <p>search</p>
            <p>
              구매를 원하는
              <br />
              상품을 검색하세요
            </p>
            <p>
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      </div>
      <!--con box3-->
      <div class="con-box con3">
        <div class="container">
          <img
            src="./IMGS/Img_home_03.png"
            alt="판매 일러스트"
            class="con-img"
          />
          <div class="con-text">
            <p>Register</p>
            <p>
              판매를 원하는
              <br />
              상품을 등록하세요
            </p>
            <p>
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
      <div class="home-bottom">
        <div class="container">
          <div class="bottom-text">
            <p>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </p>
          </div>
          <img src="./IMGS/Img_home_bottom.png" alt="bottom-banner" />
        </div>
      </div>
    </main>
    <!--메인 끝-->

    <!--푸터 시작-->
    <footer class="footer">
      <div class="container">
        <p>©codeit - 2024</p>
        <nav class="footer-menu">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </nav>
        <div class="sns-icon">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./IMGS/ic_facebook.png" alt="" />
          </a>
          <a href="https://x.com/" target="_blank" rel="noopener noreferrer">
            <img src="./IMGS/ic_twitter.png" alt="" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./IMGS/ic_youtube.png" alt="" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="./IMGS/ic_instagram.png" alt="" />
          </a>
        </div>
      </div>
    </footer>
    <!--푸터 끝-->
  </body>
</html>
