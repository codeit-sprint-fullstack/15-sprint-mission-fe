<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-CEEF4V3CWK"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag("js", new Date())

      gtag("config", "G-CEEF4V3CWK")
    </script>
    <!-- og -->
    <meta
      property="og:image"
      content="https://edgewoodreit.com/wp-content/uploads/2017/05/placeholder-800x400.jpeg"
    />
    <meta property="og:title" content="판다마켓" />
    <meta
      property="og:description"
      content="일상에서 모든 물건을 거래해보세요"
    />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/index.css" />
    <link rel="stylesheet" href="./styles/global.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
  </head>
  <body>
    <!-- nav -->
    <nav class="gnb">
      <div class="gnb-wrapper">
        <a class="gnb__logo-wrapper" href="./index.html">
          <img class="gnb__logo" src="./assets/logo.png" alt="판다마켓 로고" />
          <img
            class="gnb__logo-type"
            src="./assets/logo-type.png"
            alt="판다마켓 로고 타입"
          />
        </a>
        <button id="gnb__btn-login" class="gnb__btn-login">로그인</button>
      </div>
    </nav>
    <!-- content -->
    <main>
      <!-- main banner -->
      <section class="main-banner">
        <div class="main-banner-wrapper">
          <div class="banner__left">
            <p class="banner__left-title title">
              일상의 모든 물건을
              <br />
              거래해 보세요
            </p>
            <a class="banner__left-btn" href="./items.html">구경하러 가기</a>
          </div>
          <div class="banner__right">
            <img
              src="./assets/Img_home_top.png"
              alt="판다마켓 메인 배너 이미지"
            />
          </div>
        </div>
      </section>
      <!-- section-popularity -->
      <section class="section-container">
        <div class="content-wrapper">
          <div class="content__img-wrapper">
            <img
              src="./assets/section_popularity.png"
              alt="인기상품 설명 이미지"
            />
          </div>
          <div class="content__info">
            <p class="popularity__label label">Hot item</p>
            <p class="popularity__title title section-title">
              인기 상품을
              <br />
              확인해 보세요
            </p>
            <p class="popularity__desc section-desc">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>
      <!-- section-search -->
      <section class="section-container">
        <div class="content-wrapper content-wrapper-right">
          <div class="content__info text-align-right">
            <p class="popularity__label label">Search</p>
            <p class="popularity__title title section-title">
              구매를 원하는
              <br />
              상품을 검색하세요
            </p>
            <p class="popularity__desc section-desc">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <div class="content__img-wrapper">
            <img src="./assets/section_search.png" alt="검색 추천 이미지" />
          </div>
        </div>
      </section>
      <!-- section-registration -->
      <section class="section-container">
        <div class="content-wrapper">
          <div class="content__img-wrapper">
            <img
              src="./assets/section_registration.png"
              alt="상품 등록 설명 이미지"
            />
          </div>
          <div class="content__info">
            <p class="popularity__label label">Register</p>
            <p class="popularity__title title section-title">
              판매를 원하는
              <br />
              상품을 등록하세요
            </p>
            <p class="popularity__desc section-desc">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>
      <!-- section-banner-bottom -->
      <section class="banner-bottom">
        <div class="banner-bottom-wrapper">
          <p class="banner-bottom__desc title">
            믿을 수 있는
            <br />
            판다마켓 중고 거래
          </p>
          <div class="banner-bottom__img">
            <img src="./assets/Img_home_bottom.png" alt="하단 배너 이미지" />
          </div>
        </div>
      </section>
    </main>
    <!-- footer -->
    <footer class="footer">
      <div class="footer-wrapper">
        <span class="footer-copyright">©codeit - 2024</span>
        <div class="footer-policy-faq-wrapper">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./faq.html">FAQ</a>
        </div>
        <div class="footer-sns-wrapper">
          <a href="https://facebook.com" target="_blank">
            <img src="./assets/ic_facebook.png" alt="페이스북 아이콘" />
          </a>
          <a href="https://twitter.com" target="_blank">
            <img src="./assets/ic_twitter.png" alt="트위터 아이콘" />
          </a>
          <a href="https://youtube.com" target="_blank">
            <img src="./assets/ic_youtube.png" alt="유튜브 아이콘" />
          </a>
          <a href="https://instagram.com" target="_blank">
            <img src="./assets/ic_instagram.png" alt="인스타그램 아이콘" />
          </a>
        </div>
      </div>
    </footer>
    <script>
      document.querySelector("#gnb__btn-login").onclick = () => {
        location.href = "./login.html"
      }
    </script>
  </body>
</html>
