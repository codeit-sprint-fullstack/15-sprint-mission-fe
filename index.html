<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="./images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./indexStyle.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XQMR3MRDWV"

        dataLayer.push(arguments);

  <body>
    <header>
      <div class="header-contents">
        <div class="header-logo">
          <a href="#">
            <img src="./images/panda-face.png" alt="판다로고" />
            <span>판다마켓</span>
          </a>
        </div>
        <a class="login-button" href="./login.html">로그인</a>
      </div>
    </header>

    <section class="hero">
      <div class="hero-container">
        <div class="hero-contents">
          <h1>
            일상의 모든 물건을
            <br />
            거래해 보세요
          </h1>
          <a href="./items.html" target="_blank">구경하러 가기</a>
        </div>
        <img src="./images/hero-image.png" alt="첫 섹션 판다 이미지" />
      </div>
    </section>

    <section class="section1">
      <div class="section-container">
        <img class="section-img" src="./images/feature1-image.png" />
        <div class="section1-contents">
          <p class="label">Hot item</p>
          <h1>
            인기 상품을
            <br />
            확인해 보세요
          </h1>
          <h2>
            가장 HOT한 중고거래 물품을
            <br />
            판다 마켓에서 확인해 보세요
          </h2>
        </div>
      </div>
    </section>

    <section class="section2">
      <div class="section-container">
        <div class="section2-contents">
          <p class="label">Search</p>
          <h1>
            구매를 원하는
            <br />
            상품을 검색하세요
          </h1>
          <h2>
            구매하고 싶은 물품은 검색해서
            <br />
            쉽게 찾아보세요
          </h2>
        </div>
        <img class="section-img" src="./images/feature2-image.png" />
      </div>
    </section>

    <section class="section3">
      <div class="section-container">
        <img class="section-img" src="./images/feature3-image.png" />
        <div class="section3-contents">
          <p class="label">Register</p>
          <h1>
            판매를 원하는
            <br />
            상품을 등록하세요
          </h1>
          <h2>
            어떤 물건이든 판매하고 싶은 상품을
            <br />
            쉽게 등록하세요
          </h2>
        </div>
      </div>
    </section>

    <section class="closeSection">
      <div class="closeSection-container">
        <h1>
          믿을 수 있는
          <br />
          판다마켓 중고 거래
        </h1>
        <img src="./images/bottom-banner-image.png" />
      </div>
    </section>

    <footer>
      <div class="footer-container">
        <p class="footer-copyright">@codeit - 2024</p>
        <div class="footer-contents">
          <a href="./privacy.html">Privacy Policy</a>
          <a href="./faq.html">FAQ</a>
        </div>
        <div class="footer-sns">
          <a href="https://www.facebook.com" target="_blank">
            <img src="./images/ic_facebook.png" />
          </a>
          <a href="https://x.com" target="_blank">
            <img src="./images/ic_twitter.png" />
          </a>
          <a href="https://www.youtube.com" target="_blank">
            <img src="./images/ic_youtube.png" />
          </a>
          <a href="https://www.instagram.com" target="_blank">
            <img src="./images/ic_instagram.png" />
          </a>
        </div>
      </div>
    </footer>
