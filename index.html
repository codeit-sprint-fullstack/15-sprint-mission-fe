<!DOCTYPE html>
<html>
  <head> 
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>title</title>
  </head>
  <header>
    <nav>
      <div class="logo">
        <img src="img/Img_panda_face.svg">
        <div class="logo__text">판다마켓</div>
      </div>
      <div class="btn_small">로그인</div>
    </nav>
  </header>
  <body>
    <section class="section__1">
      <div class="main">
        <div class="main__text">
          <h3>일상의 모든 물건을 거래해 보세요</h3>
          <div class="btn_large">구경하러 가기</div>
        </div>
        <img src="img/Img_home_top.png">      
      </div>
    </section>
    
    <section class="section__2">
      <div class="main">
        <img src="img/Img_home_2.png">
        <div class="main__text">
          <h6>Hot item</h6>
          <h3>인기 상품을확인해 보세요</h3>
          <h5>가장 HOT한 중고거래 물품을 판다 마켓에서 확인해 보세요</h5>
        </div>
      </div>
    </section>
    
    <section class="section__3">
      <div class="main">
        <div class="main__text">
          <h6>Search</h6>
          <h3>구매를 원하는 상품을 검색하세요</h3>
          <h5>구매하고 싶은 물품은 검색해서 쉽게 찾아보세요</h5>
        </div>
        <img src="img/Img_home_3.png">        
      </div>
    </section>

     <section class="section__4">
      <div class="main">
        <img src="img/Img_home_4.png">  
        <div class="main__text">
          <h6>Register</h6>
          <h3>판매를 원하는 상품을 등록하세요</h3>
          <h5>어떤 물건이든 판매하고 싶은 상품을 쉽게 등록하세요</h5>
        </div>              
      </div>
    </section>

    
  </body>
</html>
