<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-7J2TNJYLS9"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7J2TNJYLS9");
    </script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/main.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header>
      <div class="gnb-container">
        <div class="gnb-brand">
          <a href="/">
            <img
              src="/assets/images/logo.png"
              alt="판다마켓 로고 이미지"
              class="gnb-brand-logo"
            />
          </a>
        </div>
        <div class="gnb-login">
          <a href="/login" class="btn-base btn-sm-48 btn-primary">로그인</a>
        </div>
      </div>
    </header>
    <main>
      <div class="visual-top">
        <div class="visual-container">
          <div class="visual-content">
            <div class="visual-info">
              <h1 class="info-text">
                일상의 모든 물건을
                <br />
                거래해 보세요
              </h1>
              <div class="info-button">
                <a href="/items" class="btn-base btn-lg btn-primary">
                  구경하러 가기
                </a>
              </div>
            </div>
            <img
              src="/assets/images/img_home_top.png"
              alt="쇼핑백을 들고 인사하고 있는 판다 캐릭터 이미지"
              class="visual-image"
            />
          </div>
        </div>
      </div>
      <div class="content-body">
        <div class="content-items">
          <div class="content-item">
            <div class="item-box">
              <img
                src="/assets/images/img_home_01.png"
                alt="옷(상품)을 구경하는 이미지"
                class="content-item-image"
              />
              <div class="text-box">
                <span class="item-tag text-2lg-bold">Hot Item</span>
                <h2 class="item-title">
                  인기 상품을
                  <br />
                  확인해 보세요
                </h2>
                <p class="item-desc text-2xl-medium">
                  가장 HOT한 중고거래 물품을
                  <br />
                  판다 마켓에서 확인해 보세요
                </p>
              </div>
            </div>
          </div>
          <div class="content-item">
            <div class="item-box">
              <div class="text-box-left">
                <span class="item-tag text-2lg-bold">Search</span>
                <h2 class="item-title">
                  구매를 원하는
                  <br />
                  상품을 검색하세요
                </h2>
                <p class="item-desc text-2xl-medium">
                  구매하고 싶은 물품은 검색해서
                  <br />
                  쉽게 찾아보세요
                </p>
              </div>
              <img
                src="/assets/images/img_home_02.png"
                alt="돋보기를 사용하여 자세히 보는 이미지"
                class="content-item-image"
              />
            </div>
          </div>
          <div class="content-item">
            <div class="item-box">
              <img
                src="/assets/images/img_home_03.png"
                alt="판매 상품 등록 안내 이미지"
                class="content-item-image"
              />
              <div class="text-box">
                <span class="item-tag text-2lg-bold">Register</span>
                <h2 class="item-title">
                  판매를 원하는
                  <br />
                  상품을 등록하세요
                </h2>
                <p class="item-desc text-2xl-medium">
                  어떤 물건이든 판매하고 싶은 상품을
                  <br />
                  쉽게 등록하세요
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="visual-bottom">
        <div class="visual-container">
          <div class="visual-content">
            <div class="visual-info">
              <h2 class="info-text">
                믿을 수 있는
                <br />
                판다마켓 중고 거래
              </h2>
            </div>
            <img
              src="/assets/images/img_home_bottom.png"
              alt="쇼핑백을 들고 서로 인사하고 있는 판다 캐릭터 2명 이미지"
              class="visual-image"
            />
          </div>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-container">
        <div class="footer-content">
          <div class="footer-brand">&copy;codeit - 2024</div>
          <div class="footer-links">
            <a href="/privacy">Privacy Policy</a>
            <a href="/faq">FAQ</a>
          </div>
          <div class="footer-social">
            <a href="https://www.facebook.com/" target="_blank">
              <img
                src="/assets/icons/ic_facebook.svg"
                alt="페이스북 아이콘"
                class="ic_facebook"
              />
            </a>
            <a href="https://x.com/" target="_blank">
              <img
                src="/assets/icons/ic_twitter.svg"
                alt="트위터 아이콘"
                class="ic_twitter"
              />
            </a>
            <a href="https://www.youtube.com/" target="_blank">
              <img
                src="/assets/icons/ic_youtube.svg"
                alt="유튜브 아이콘"
                class="ic_youtube"
              />
            </a>
            <a href="https://www.instagram.com/" target="_blank">
              <img
                src="/assets/icons/ic_instagram.svg"
                alt="인스타그램 아이콘"
                class="ic_instagram"
              />
            </a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
