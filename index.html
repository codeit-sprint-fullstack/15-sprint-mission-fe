<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/typography.css" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner max-width">
        <a class="header__logo" href="/">
          <img src="/images/panda_logo.svg" alt="판다마켓 로고 이미지" />
        </a>
        <a class="header__login text-lg font-semibold" href="/login">로그인</a>
      </div>
    </header>
    <main>
      <section class="section__hero">
        <div class="hero__inner max-width">
          <div class="hero__header">
            <h1 class="hero__title text-4xl font-bold">
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>
            <a class="hero__link text-xl font-semibold" href="/items/">
              구경하러 가기
            </a>
          </div>
          <img
            class="hero__img"
            src="/images/Img_home_top.png"
            alt="장바구니를 들고 있는 팬더 일러스트 이미지"
          />
        </div>
      </section>
      <section class="section__hot-item">
        <div class="hot-item__inner max-width">
          <div class="hot-item__wrapper">
            <img
              class="hot-item__img"
              src="/images/Img_home_01.png"
              alt="인기 상품 아이템 일러스트 이미지"
            />
            <div class="hot-item__header">
              <div class="hot-item__tag text-2lg font-bold">Hot item</div>
              <h2 class="hot-item__title text-4xl font-bold">
                인기 상품을
                <br />
                확인해 보세요
              </h2>
              <p class="hot-item__text text-2xl font-medium">
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="section__search"></section>
      <section class="section__register"></section>
    </main>
    <footer></footer>
  </body>
</html>
