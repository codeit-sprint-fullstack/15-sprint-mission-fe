<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FS 15기 배기홍 스프린트 미션1</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <div>
        <a id="header-logo" href="">
          <img src="./images/panda-face.png" alt="pandaMarket-logo" />
          <span>판다마켓</span>
        </a>
        <a class="loginButton" href="./login.html" target="_blank">로그인</a>
      </div>
    </header>
    <main>
      <section class="top">
        <div class="topContent">
          <div>
            <h1>
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>
            <a href="./items.html" target="_blank">구경하러 가기</a>
          </div>
          <img src="./images/Img_home_top.png" alt="" />
        </div>
      </section>

      <section class="hotItem">
        <div class="hotItem-content">
          <img src="./images/Img_home_01.png" alt="" />
          <div>
            <span class="sectionLabel">Hot item</span>
            <h1>
              인기 상품을
              <br />
              확인해 보세요
            </h1>
            <p class="description">
              가장 HOT한 중고거래 물품을
              <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="search">
        <div class="search-content">
          <div>
            <span class="sectionLabel">Search</span>
            <h1>
              구매를 원하는
              <br />
              상품을 검색하세요
            </h1>
            <p class="description">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
          <img src="./images/Img_home_02.png" alt="" />
        </div>
      </section>

      <section class="register">
        <div class="register-content">
          <img src="./images/Img_home_03.png" alt="" />
          <div>
            <span class="sectionLabel">Register</span>
            <h1>
              판매를 원하는
              <br />
              상품을 등록하세요
            </h1>
            <p class="description">
              어떤 물걸이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom">
        <div class="bottomBackground">
          <div class="bottomContent">
            <h1>
              믿을 수 있는
              <br />
              판다마켓 중고 거래
            </h1>
            <img src="./images/Img_home_bottom.png" alt="" />
          </div>
        </div>
      </section>

      <footer>
        <div class="footerContent">
          <p>©codeit - 2024</p>
          <div class="link">
            <a href="./privacy.html" target="_blank">Privacy Policy</a>
            <a href="./faq.html" target="_blank">FAQ</a>
          </div>
          <div class="sns">
            <a href="https://www.facebook.com/?locale=ko_KR" target="_blank">
              <img src="./images/ic_facebook.png" alt="페이스북" />
            </a>
            <a href="https://x.com/?lang=ko" target="_blank">
              <img src="./images/ic_twitter.png" alt="트위터" />
            </a>
            <a
              href="youtube.com/?app=desktop&hl=ko&gl=KR&themeRefresh=1"
              target="_blank"
            >
              <img src="./images/ic_youtube.png" alt="유투브" />
            </a>
            <a href="https://www.instagram.com/" target="_blank">
              <img src="./images/ic_instagram.png" alt="인스타" />
            </a>
          </div>
        </div>
      </footer>
    </main>
  </body>
</html>
