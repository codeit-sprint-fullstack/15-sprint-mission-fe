   <body>
    <header>
      <nav>
        <a class="logo__link" href="/" >
          <img src="/img/img_panda_face.svg" alt="판다 로고 이미지" />
          <div class="logo__text">판다마켓</div>
        </a>
        <a class="btn btn--login" href="/pages/login.html">로그인</a>
      </nav>
    </header>
    <main>
      <section class="section--1">
        <div class="container">
          <div class="container__text">
            <h1>일상의 모든 물건을<br>거래해 보세요</h1>
            <a class="btn btn--item" href="/pages/item.html">구경하러 가기</a>
          </div>
          <img src="/img/img_home_top.png" alt="여러 중고 상품이 진열된 판다마켓의 화면 이미지" />      
        </div>
      </section>
      <section class="section--2">
        <div class="container">
          <img src="/img/img_home_2.png" alt="인기 상품을 보여주는 화면 이미지" />
          <div class="container__text">
            <p>Hot item</p>
            <h2>인기 상품을<br>확인해 보세요</h2>
            <p class="section__desc">가장 HOT한 중고거래 물품을<br>판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </section>
      <section class="section--3">
        <div class="container">
          <div class="container__text">
            <p>Search</p>
            <h2>구매를 원하는<br>상품을 검색하세요</h2>
            <p class="section__desc">구매하고 싶은 물품은 검색해서<br>쉽게 찾아보세요</p>
          </div>
          <img src="/img/img_home_3.png" alt="구매하고 싶은 물품을 찾는 화면 이미지" />        
        </div>
      </section>
      <section class="section--4">
       <div class="container">
         <img src="/img/img_home_4.png" alt="판매를 원하는 상품을 등록하는 화면 이미지" />  
         <div class="container__text">
           <p>Register</p>
           <h2>판매를 원하는<br>상품을 등록하세요</h2>
           <p class="section__desc">어떤 물건이든 판매하고 싶은 상품을<br>쉽게 등록하세요</p>
         </div>              
       </div>
     </section>
      <section class="section--5">
        <div class="container">     
          <h2>믿을 수 있는<br>판다마켓 중고 거래</h2>          
          <img src="/img/img_home_5.png" alt="믿을 수 있는 판다 마켓 소개 화면 이미지" />             
        </div>
      </section>
