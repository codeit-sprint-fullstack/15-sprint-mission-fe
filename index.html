<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/typography.css" />
    <link rel="stylesheet" href="/common.css" />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner max-width">
        <a class="header__logo" href="/">
          <img src="/images/panda_logo.svg" alt="판다마켓 로고 이미지" />
        </a>
        <a class="header__login text-lg font-semibold" href="/login">로그인</a>
      </div>
    </header>
    <main>
      <section class="section__hero">
        <div class="hero__inner max-width">
          <div class="hero__header">
            <h1 class="hero__title text-4xl font-bold">
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>
            <a class="hero__link text-xl font-semibold" href="/items/">
              구경하러 가기
            </a>
          </div>
          <img
            class="hero__img"
            src="/images/Img_home_top.png"
            alt="장바구니를 들고 있는 팬더 일러스트 이미지"
          />
        </div>
      </section>
      <section class="section__hot-item">
        <div class="hot-item__inner max-width">
          <div class="hot-item__wrapper">
            <img
              class="hot-item__img"
              src="/images/Img_home_01.png"
              alt="인기 상품 아이템 일러스트 이미지"
            />
            <div class="hot-item__header">
              <div class="hot-item__tag text-2lg font-bold">Hot item</div>
              <h2 class="hot-item__title text-4xl font-bold">
                인기 상품을
                <br />
                확인해 보세요
              </h2>
              <p class="hot-item__text text-2xl font-medium">
                가장 HOT한 중고거래 물품을
                <br />
                판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="section__search">
        <div class="search__inner max-width">
          <div class="search__wrapper">
            <div class="search__header">
              <div class="search__tag text-2lg font-bold">Search</div>
              <h2 class="search__title text-4xl font-bold">
                구매를 원하는
                <br />
                상품을 검색하세요
              </h2>
              <p class="search__text text-2xl font-medium">
                구매하고 싶은 물품은 검색해서
                <br />
                쉽게 찾아보세요
              </p>
            </div>
            <img
              class="search__img"
              src="/images/Img_home_02.png"
              alt="상품 검색 일러스트 이미지"
            />
          </div>
        </div>
      </section>
      <section class="section__register">
        <div class="register__inner max-width">
          <div class="register__wrapper">
            <img
              class="register__img"
              src="/images/Img_home_03.png"
              alt="상품 등록 일러스트 이미지"
            />
            <div class="register__header">
              <div class="register__tag text-2lg font-bold">Register</div>
              <h2 class="register__title text-4xl font-bold">
                판매를 원하는
                <br />
                상품을 등록하세요
              </h2>
              <p class="register__text text-2xl font-medium">
                어떤 물건이든 판매하고 싶은 상품을
                <br />
                쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section class="section__bottom">
        <div class="bottom__inner">
          <div class="bottom__wrapper max-width">
            <div class="bottom__header">
              <h3 class="bottom__title text-4xl font-bold">
                믿을 수 있는
                <br />
                판다마켓 중고 거래
              </h3>
            </div>
            <img class="bottom__img" src="/images/Img_home_bottom.png" alt="" />
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
