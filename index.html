<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="gnb">
      <div class="gnb-inner">
        <a href="/">
          <img src="images/logo.png" alt="판다마켓 로고" />
        </a>

        <a class="login-link" href="/login">로그인</a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-content">
            <h1 class="hero-title">
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>

            <a class="browse-link" href="/items">구경하러 가기</a>
          </div>

          <img
            class="hero-image"
            src="images/hero-image.png"
            alt="판다마켓에서 물건을 거래하는 모습"
          />
        </div>
      </section>
    </main>
  </body>
</html>
