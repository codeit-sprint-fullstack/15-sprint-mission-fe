<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <header class="gnb">
      <div class="gnb-inner">
        <a href="/">
          <img src="images/logo.png" alt="판다마켓 로고" />
        </a>

        <a class="login-link" href="/login">로그인</a>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-inner">
          <div class="hero-content">
            <h1 class="hero-title">
              일상의 모든 물건을
              <br />
              거래해 보세요
            </h1>

            <a class="browse-link" href="/items">구경하러 가기</a>
          </div>

          <img
            class="hero-image"
            src="images/hero-image.png"
            alt="판다마켓에서 물건을 거래하는 모습"
          />
        </div>
      </section>
      <section class="feature-section feature-section-hot">
        <div class="feature">
          <img
            class="feature-image"
            src="images/feature1-image.png"
            alt="인기 상품을 살펴보는 모습"
          />

          <div class="feature-content">
            <p class="feature-tag">Hot item</p>
            <h2 class="feature-title">
              인기 상품을
              <br />
              확인해 보세요
            </h2>
            <p class="feature-description">
              가장 HOT한 중고거래 물품을
              <br />
              판다마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature-section feature-section-search">
        <div class="feature feature-reverse">
          <div class="feature-content">
            <p class="feature-tag">Search</p>
            <h2 class="feature-title">
              구매를 원하는
              <br />
              상품을 검색하세요
            </h2>
            <p class="feature-description">
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>

          <img
            class="feature-image"
            src="images/feature2-image.png"
            alt="상품을 검색하는 모습"
          />
        </div>
      </section>

      <section class="feature-section feature-section-register">
        <div class="feature">
          <img
            class="feature-image"
            src="images/feature3-image.png"
            alt="판매할 상품을 등록하는 모습"
          />

          <div class="feature-content">
            <p class="feature-tag">Register</p>
            <h2 class="feature-title">
              판매를 원하는
              <br />
              상품을 등록하세요
            </h2>
            <p class="feature-description">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="bottom-banner">
        <div class="bottom-banner-inner">
          <h2 class="bottom-banner-title">
            믿을 수 있는
            <br />
            판다마켓 중고거래
          </h2>

          <img
            class="bottom-banner-image"
            src="images/bottom-banner-image.png"
            alt="판다마켓 중고거래 모습"
          />
        </div>
      </section>
    </main>
  </body>
</html>
