<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main>
      <section class="login-section">
        <a class="home-page" href="../pandamarket.html">
          <img class="pandamarket.logo" />
        </a>

        <div class="input-div">
          <label class="input-label" for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요"
          />

          <label class="input-label" for="password">비밀번호</label>
          <div class="password-div">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <img
              class="password-check-icon"
              src="/pandaImg/btn_visibility_on_24px.svg"
              alt="passward-check.img"
            />
          </div>
          <button class="login-button">로그인</button>
        </div>

        <div class="fast-login">
          <p>간편 로그인하기</p>
          <div class="sns-login">
            <a class="item" href="https://www.google.com/?hl=ko">
              <img
                class="google-login"
                src="../../loginpageimg/Component 2-1.png"
                alt="google.img"
              />
            </a>

            <a class="item" href="https://www.kakaocorp.com/page/">
              <img
                class="kakaotalk-login"
                src="../../loginpageimg/Component 3.png"
                alt="kakaotalk.img"
              />
            </a>
          </div>
        </div>
        <div class="sigh-up-div">
          <p class="sign-up">판다마켓이 처음이신가요?</p>
          <a class="go-sigh-up" href="../signup/signup.html">회원가입</a>
        </div>
      </section>
    </main>
  </body>
</html>
