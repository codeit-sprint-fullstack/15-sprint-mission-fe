<!doctype html>

<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="pandamarket.css" />
  </head>

  <body>
    <header>
      <div class="title">
        <img
          class="market-logo"
          src="../pandaImg/Property 1=lg.png"
          alt="판다얼굴logo"
        />

        <button class="login-button">로그인</button>
      </div>
    </header>
    <main>
      <section class="home-section">
        <div class="message-button-div">
          <p class="home-message">
            일상의 모든 물건을
            <br />
            거래해보세요
          </p>
          <button class="search-button">구경하러 가기</button>
        </div>
        <img
          class="panda-home-img"
          src="../pandaImg/Img_home_top.png"
          alt="panda_home_top_img"
        />
      </section>

      <section class="hot-item-section">
        <div class="section-img-div">
          <img
            class="hot-item-img"
            src="../pandaImg/Img_home_01.png"
            alt="hot-item-img"
          />
          <div class="hot-item-messege">
            <h4>hot item</h4>
            <p>
              인기 상품을
              <br />
              확인해 보세요
            </p>
            <p>
              가장 HOT 한 중고거래 물품을
              <br />
              판다 마켓에서 확인해보세요
            </p>
          </div>
        </div>
      </section>

      <section class="serach-section"></section>
<div class="section-img-div">
          <img
            class="hot-item-img"
            src="../pandaImg/Img_home_01.png"
            alt="hot-item-img"
          />
          <div class="Search-messege">
            <h4>Search</h4>
            <p>
              구매를 원하는
              <br />
              상품을 검색하세요
            </p>
            <p>
              구매하고 싶은 물품은 검색해서
              <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
      <section class="register-section"></section>
    </main>
  </body>
</html>
