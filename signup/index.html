<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <title>판다마켓 회원가입</title>
  </head>

  <body>
    <main class="signup-page">
      <div class="signup-container">
        <a class="home-logo" href="/">
          <img src="../images/logo.png" alt="판다마켓 홈" />
        </a>

        <form class="signup-form">
          <div class="input-area">
            <label class="input-label" for="email">이메일</label>

            <input
              class="signup-input"
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해 주세요"
            />
          </div>

          <div class="input-area">
            <label class="input-label" for="nickname">닉네임</label>

            <input
              class="signup-input"
              id="nickname"
              name="nickname"
              type="text"
              placeholder="닉네임을 입력해 주세요"
            />
          </div>

          <div class="input-area">
            <label class="input-label" for="password">비밀번호</label>

            <div class="password-area">
              <input
                class="signup-input password-input"
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해 주세요"
              />

              <button class="password-button" type="button">
                <img
                  class="password-icon"
                  src="../images/ic_visibility_off.png"
                  alt="비밀번호 보기"
                />
              </button>
            </div>
          </div>

          <div class="input-area">
            <label class="input-label" for="password-check">
              비밀번호 확인
            </label>

            <div class="password-area">
              <input
                class="signup-input password-input"
                id="password-check"
                name="password-check"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해 주세요"
              />

              <button class="password-button" type="button">
                <img
                  class="password-icon"
                  src="../images/ic_visibility_off.png"
                  alt="비밀번호 확인 보기"
                />
              </button>
            </div>
          </div>

          <button class="signup-button" type="submit">회원가입</button>
        </form>

        <div class="simple-login">
          <p class="simple-login-title">간편 로그인하기</p>

          <div class="simple-login-links">
            <a class="simple-login-link" href="https://www.google.com/">
              <img src="../images/ic_google.png" alt="구글 로그인" />
            </a>

            <a class="simple-login-link" href="https://www.kakaocorp.com/page/">
              <img src="../images/ic_kakao.png" alt="카카오 로그인" />
            </a>
          </div>
        </div>

        <p class="login-message">
          이미 회원이신가요?
          <a class="login-page-link" href="/login">로그인</a>
        </p>
      </div>
    </main>
  </body>
</html>
