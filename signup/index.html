<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-7J2TNJYLS9"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-7J2TNJYLS9");
    </script>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <main>
      <div class="main-container">
        <a href="/" class="logo">
          <img src="../assets/images/logo-lg.png" alt="판다마켓 로고 이미지와 타이틀" />
        </a>
        <div class="content-container">
          <div class="form-box">
            <form>
              <div class="input-box">
                <label for="input-email">이메일</label>
                <div class="input-wrapper">
                  <input
                    type="email"
                    id="input-email"
                    placeholder="이메일을 입력해주세요"
                  />
                </div>
              </div>
              <div class="input-box">
                <label for="input-nickname">닉네임</label>
                <div class="input-wrapper">
                  <input
                    type="text"
                    id="input-nickname"
                    placeholder="닉네임을 입력해주세요"
                  />
                </div>
              </div>
              <div class="input-box">
                <label for="input-password">비밀번호</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    id="input-password"
                    placeholder="비밀번호를 입력해주세요"
                  />
                  <button type="button" class="eye-button">
                    <img
                      src="../assets/icons/btn_visibility_off.svg"
                      alt="비밀번호 표시/숨김"
                    />
                  </button>
                </div>
              </div>
              <div class="input-box">
                <label for="input-password-check">비밀번호 확인</label>
                <div class="input-wrapper">
                  <input
                    type="password"
                    id="input-password-check"
                    placeholder="비밀번호를 다시 한 번 입력해주세요"
                  />
                  <button type="button" class="eye-button">
                    <img
                      src="../assets/icons/btn_visibility_off.svg"
                      alt="비밀번호 표시/숨김"
                    />
                  </button>
                </div>
              </div>
              <button type="button" class="btn-base btn-lg btn-primary">
                회원가입
              </button>
            </form>
          </div>
          <div class="social-login-box">
            <span class="text-lg-medium">간편 로그인하기</span>
            <div class="social-btns">
              <a href="https://www.google.com/">
                <img
                  src="../assets/images/icon_google.png"
                  alt="구글 로고 아이콘"
                  class="social-icon"
                />
              </a>
              <a href="https://www.kakaocorp.com/page/">
                <img
                  src="../assets/images/icon_kakao.png"
                  alt="카카오 로고 아이콘"
                  class="social-icon"
                />
              </a>
            </div>
          </div>
          <div class="auth-box">
            <span class="auth-info">이미 회원이신가요?</span>
            <a class="auth-link" href="../login/">로그인</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
