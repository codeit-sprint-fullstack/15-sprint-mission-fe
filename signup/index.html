<!doctype html>

<html lang="ko">
  <head>
     <!-- Google Analytics (GA4) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-XXXXXXXXXX");
    </script>
    <!-- End Google Analytics -->

    <meta charset="UTF-8" />
    <link rel="stylesheet" href="signup.css" />
    <title>판다마켓</title>
  </head>

  <body>
    <main>
      <section class="signup-section">
        <a class="home-page" href="../index.html">
          <img
            class="pandamarket.logo"
            src="../../pandaImg/Property 1=lg.png"
            alt="판다마켓로고"
          />
        </a>

        <div class="input-div">
          <label class="input-label" for="email">
            이메일
            <input
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
            />
          </label>

          <label class="input-label" for="username">
            닉네임
            <input
              id="username"
              name="username"
              placeholder="닉네임을 입력해주세요"
            />
          </label>

          <label class="input-label" for="password">비밀번호</label>
          <div class="password-div">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <img
              class="password-check-icon"
              src="/pandaImg/ic_eye.svg"
              alt="비밀번호체크이미지"
            />
          </div>

          <label class="input-label" for="password-check">비밀번호 확인</label>
          <div class="password-div">
            <input
              id="password-check"
              name="password-check"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
            <img
              class="password-check-icon"
              src="/pandaImg/ic_eye.svg"
              alt="비밀번호체크이미지"
            />
          </div>

          <button class="sign-up-button">회원가입</button>
        </div>

        <div class="fast-login">
          <p>간편 로그인하기</p>
          <div class="sns-login">
            <a class="item" href="https://www.google.com/?hl=ko">
              <img
                class="google-login"
                src="../loginpageimg/goolgleComponent.png"
                alt="구글"
              />
            </a>

            <a class="item" href="https://www.kakaocorp.com/page/">
              <img
                class="kakaotalk-login"
                src="../loginpageimg/kakaoTalkComponent.png"
                alt="카카오톡"
              />
            </a>
          </div>
        </div>
        <div class="login-div">
          <p class="login">이미 회원이신가요?</p>
          <a class="go-login" href="../login"">로그인</a>
        </div>
      </section>
    </main>
  </body>
</html>
