<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <title>판다마켓 로그인</title>
  </head>

  <body>
    <main class="login-page">
      <div class="login-wrapper">
        <a class="brand-link" href="/">
          <img class="brand-logo" src="../images/logo.png" alt="판다마켓 홈" />
        </a>

        <form class="login-form">
          <div class="field-group">
            <label class="field-label" for="email">이메일</label>

            <input
              class="text-input"
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해 주세요"
            />
          </div>

          <div class="field-group">
            <label class="field-label" for="password">비밀번호</label>

            <div class="password-box">
              <input
                class="text-input password-input"
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해 주세요"
              />

              <button class="visibility-button" type="button">
                <img
                  class="visibility-icon"
                  src="../images/ic_visibility_off.png"
                  alt="비밀번호 보기"
                />
              </button>
            </div>
          </div>

          <button class="login-submit" type="submit">로그인</button>
        </form>

        <div class="easy-login">
          <p class="easy-login-title">간편 로그인하기</p>

          <div class="social-links">
            <a class="social-link" href="https://www.google.com/">
              <img src="../images/ic_google.png" alt="구글 로그인" />
            </a>

            <a class="social-link" href="https://www.kakaocorp.com/page/">
              <img src="../images/ic_kakao.png" alt="카카오 로그인" />
            </a>
          </div>
        </div>

        <p class="signup-guide">
          판다마켓이 처음이신가요?
          <a class="signup-link" href="/signup">회원가입</a>
        </p>
      </div>
    </main>
  </body>
</html>
