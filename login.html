<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login">
      <form>
        <a href="/" class="login_logo">
        <img class="logo" src="/image/logo.png" alt="판다마켓로고" />
        </a>
        <div class="e_p">
          <div class="email">
            <label for="login_email">이메일</label>
            <input
              id="login_email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
              required
            />
          </div>

          <div class="password">
            <label for="login_password">비밀번호</label>
            <input
              id="login_password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요"
            />
          </div>
        </div>
        <button type="submit" class="btn_login">
          <span class="btn_text">로그인</span>
        </button>
      </form>
      <div>
        <div class="b_box">
          <div class="b_text">
            <p>간편하게 로그인</p>
            <div class="icon">
              <a href="https://www.google.com/">
                <img src="/image/gnb/ic_goole.png" alt="구글바로가기" />
              </a>
              <a href="https://www.kakaocorp.com/page/">
                <img src="/image/gnb/ic_kakao.png" alt="카카오바로가기" />
              </a>
            </div>
          </div>
        </div>
        <div class="panda">
          판다마켓이 처음이신가요?
          <a href="signup.html">회원가입</a>
        </div>
      </div>
    </div>
  </body>
</html>
