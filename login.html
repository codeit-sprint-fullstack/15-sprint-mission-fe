<!DOCTYPE html>
  <html>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/login.css">
    <title>로그인</title>
    <head>       
    </head>
    <body>
      <div class="main">
        <div class="main__logo">
          <img class="main__logo__img" src="img/Img_panda_face.svg" alt="판다 로고 그림">
          <div class="main__logo__text">판다마켓</div>        
        </div>
        <div class="main__text">
          <div>
            <form>
             <label for="login-email">이메일</label>
             <input id="login-email" name="email" type="email" placeholder="이메일을 입력해주세요"/>
            </form>       
          </div>
           <div>
            <form>
              <label for="login-password">비밀번호</label>
              <input id="login-password" name="password" type="password" placeholder="비밀번호를 입력해주세요"/>
            </form>
          </div>
           <a class="btn__login" href="#">로그인</a>
    
           <div class="main__link">
            <div class="main__link__content">
              <h4>간편 로그인하기</h4> 
              <div class="logo">
                <a href="" class="google__ic" alt="구글 아이콘"></a>
                <a href="" class="kakao__ic" alt="카카오톡 아이콘"></a>
              </div> 
            </div>  
          </div>
          
          <div class="bottom">
            <h4>판다마켓이 처음이신가요?</h4>
            <a href="/signup.html"class="signup__link">회원가입</a>
          </div>
        </div>
      </div>
    </body>
  </html>
